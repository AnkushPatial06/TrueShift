<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics · TrueShift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  (function(){
    try {
      var s = localStorage.getItem('trueshift_theme_pref') || 'light';
      var r = s === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : s;
      document.documentElement.setAttribute('data-theme', r);
    } catch(e){}
  })();
</script>
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/forms.css" />
<link rel="stylesheet" href="../css/components.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .kpi-card { background: var(--color-surface); border-radius: var(--radius-md); padding: 1rem; border: 1px solid var(--color-border); box-shadow: var(--shadow-sm); }
  .kpi-header { display: flex; align-items: center; margin-bottom: 0.5rem; color: var(--color-ink-soft); font-size: 0.85rem; }
  .kpi-header svg { width: 16px; height: 16px; margin-right: 0.5rem; }
  .kpi-value { font-size: 1.5rem; font-weight: 700; color: var(--color-ink); }
  
  .filter-row { display: flex; justify-content: flex-end; margin-bottom: 1rem; }
  .filter-btn { background: var(--color-surface); border: 1px solid var(--color-border); padding: 0.35rem 0.85rem; font-size: 0.85rem; cursor: pointer; color: var(--color-ink-soft); font-weight: 500; transition: all 0.15s ease; }
  .filter-btn:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
  .filter-btn:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .filter-btn.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }
  .filter-btn:hover:not(.active) { background: var(--color-surface-alt); }
  
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
  .chart-full { grid-column: 1 / -1; }
  .chart-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow-sm); }
  .chart-title { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; color: var(--color-ink); }
  .chart-container { height: 300px; position: relative; }
</style>
</head>
<body>

<div class="app-shell">
  <aside id="app-sidebar" class="sidebar"></aside>
  <div class="main-area">
    <header class="topbar">
      <button class="hamburger-btn" id="hamburger-btn" onclick="document.getElementById('app-sidebar').classList.toggle('open')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <h1 class="topbar-title">Analytics</h1>
      <div class="topbar-right">
        <div class="theme-toggle-slot" data-theme-switcher></div>
        <div class="notif-bell-wrapper" id="notif-bell-wrapper">
          <button class="icon-btn" id="notif-bell-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="notif-badge hidden" id="notif-badge">0</span></button>
        </div>
        <div class="topbar-avatar" id="topbar-avatar">--</div>
      </div>
    </header>
    <main class="page-content">

      <div class="filter-row">
        <button class="filter-btn" data-days="7">7d</button>
        <button class="filter-btn active" data-days="14">14d</button>
        <button class="filter-btn" data-days="30">30d</button>
        <button class="filter-btn" data-days="90">90d</button>
      </div>
      
      <div class="kpi-grid" id="analytics-kpis">
        <div class="kpi-card">
          <div class="kpi-header"><svg style="color:var(--color-primary)" viewBox="0 0 24 24" fill="none"><path d="M12 4v16m8-8H4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Total Employees</div>
          <div class="kpi-value" id="stat-total">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-header"><svg style="color:var(--color-success)" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Present Today</div>
          <div class="kpi-value" id="stat-present">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-header"><svg style="color:var(--color-danger)" viewBox="0 0 24 24" fill="none"><path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Absent</div>
          <div class="kpi-value" id="stat-absent">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-header"><svg style="color:var(--color-warning)" viewBox="0 0 24 24" fill="none"><path d="M12 8v4l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>On Leave</div>
          <div class="kpi-value" id="stat-leave">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-header"><svg style="color:var(--color-purple)" viewBox="0 0 24 24" fill="none"><path d="M12 2v20m10-10H2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Late</div>
          <div class="kpi-value" id="stat-late">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-header"><svg style="color:var(--color-primary)" viewBox="0 0 24 24" fill="none"><path d="M12 20V10m0 10l-4-4m4 4l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Avg Attendance</div>
          <div class="kpi-value" id="stat-pct">—</div>
        </div>
      </div>

      <div class="chart-grid">
        <div class="chart-card">
          <div class="chart-title">Daily Attendance Overview</div>
          <div class="chart-container"><canvas id="chart-daily"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Attendance by Department</div>
          <div class="chart-container"><canvas id="chart-dept"></canvas></div>
        </div>
        
        <div class="chart-card">
          <div class="chart-title">Leave Distribution</div>
          <div class="chart-container"><canvas id="chart-leave"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">7-Day Headcount Forecast (AI)</div>
          <div class="chart-container"><canvas id="chart-forecast"></canvas></div>
        </div>
        
        <div class="chart-card chart-full">
          <div class="chart-title">Working Hours Distribution</div>
          <div class="chart-container" style="height:250px;"><canvas id="chart-hours"></canvas></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/sidebar.js"></script>
<script src="../js/components/notification-center.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/analytics.js"></script>
</body>
</html>
