<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Registration · TrueShift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function(){
      try {
        var s = localStorage.getItem('trueshift_theme_pref') || 'light';
        var r = s === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : s;
        document.documentElement.setAttribute('data-theme', r);
      } catch(e){}
    })();
  </script>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    .camera-container {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #000;
      aspect-ratio: 4/3;
      margin-bottom: 16px;
    }
    .guide-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      height: 80%;
      border: 4px dashed rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      pointer-events: none;
    }
    .stepper {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      position: relative;
    }
    .stepper::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--border-light);
      z-index: 1;
    }
    .step {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 33.33%;
    }
    .step-indicator {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      color: var(--color-ink-soft);
      transition: all 0.3s ease;
    }
    .step.active .step-indicator {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .step.completed .step-indicator {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }
    .step-label-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-ink-soft);
      text-align: center;
    }
    .step.active .step-label-text {
      color: var(--color-ink);
    }
    .capture-progress {
      text-align: center;
      font-weight: 600;
      margin-bottom: 16px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="main-area">
      <header class="topbar">
        <button class="hamburger-btn" id="hamburger-btn" onclick="document.getElementById('app-sidebar').classList.toggle('open')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <h1 class="topbar-title">Face Registration</h1>
        <div class="topbar-right">
          <div class="theme-toggle-slot" data-theme-switcher></div>
          <div class="notif-bell-wrapper" id="notif-bell-wrapper">
            <button class="icon-btn" id="notif-bell-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              <span class="notif-badge hidden" id="notif-badge">0</span>
            </button>
          </div>
          <div class="topbar-avatar" id="topbar-avatar">--</div>
        </div>
      </header>
      <main class="page-content" style="max-width:640px;margin:0 auto;">
        
        <div class="stepper" id="registration-stepper">
          <div class="step active" id="step-1">
            <div class="step-indicator">1</div>
            <div class="step-label-text">Position face</div>
          </div>
          <div class="step" id="step-2">
            <div class="step-indicator">2</div>
            <div class="step-label-text">Capture samples</div>
          </div>
          <div class="step" id="step-3">
            <div class="step-indicator">3</div>
            <div class="step-label-text">Complete</div>
          </div>
        </div>

        <div class="card" id="capture-card">
          <div class="field">
            <label>Employee ID</label>
            <input id="target-employee" placeholder="e.g. EMP-1024" />
            <div class="field-hint">Admins/HR can register on behalf of any employee_id; employees can only register their own.</div>
          </div>

          <div class="camera-container">
            <video id="camera-feed" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;"></video>
            <div class="guide-ring"></div>
          </div>
          <canvas id="capture-canvas" class="hidden"></canvas>

          <div id="capture-progress" class="capture-progress hidden">0 / 5 captures</div>

          <div style="margin-top:16px;display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div id="step-label" style="font-weight:600;"></div>
              <div id="step-progress" class="field-hint"></div>
            </div>
            <div style="display:flex;gap:10px;">
              <button id="retry-btn" class="btn btn-secondary hidden">Start over</button>
              <button id="capture-btn" class="btn btn-primary">Start Capture</button>
              <button id="submit-btn" class="btn btn-primary hidden">Submit registration</button>
            </div>
          </div>
        </div>

        <div id="result-panel" class="card hidden" style="margin-top:20px;"></div>

      </main>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/skeleton.js"></script>
  <script src="../js/components/table.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/notification-center.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/face-registration.js"></script>
</body>
</html>
