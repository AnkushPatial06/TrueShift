<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Org Chart · TrueShift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function(){
      try {
        var s = localStorage.getItem('trueshift_theme_pref') || 'light';
        var r = s === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : s;
        document.documentElement.setAttribute('data-theme', r);
      } catch(e){}
    })();
  </script>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    .org-chart-wrap {
      display: flex;
      gap: 40px;
      overflow-x: auto;
      padding: 20px 0;
    }
    .org-dept-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 260px;
    }
    .org-node-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 16px;
      width: 240px;
      text-align: center;
      box-shadow: var(--shadow-card);
      cursor: pointer;
    }
    .org-manager {
      background: var(--color-accent-blue-soft);
      border-color: var(--color-accent-blue);
    }
    .org-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--color-accent-blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      margin: 0 auto 12px;
    }
    .org-node-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 4px;
    }
    .org-node-role {
      font-size: 0.8rem;
      color: var(--color-ink-soft);
      margin-bottom: 8px;
    }
    .org-line-v {
      width: 2px;
      height: 30px;
      background: var(--color-border);
    }
    .org-children {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    .org-more-badge {
      background: var(--color-border);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--color-ink-soft);
    }
    @media print {
      .sidebar { display: none !important; }
      .topbar { display: none !important; }
      .main-area { padding: 0 !important; }
      .app-shell { display: block !important; }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <aside id="app-sidebar" class="sidebar"></aside>
  <div class="main-area">
    <header class="topbar">
      <button class="hamburger-btn" onclick="document.getElementById('app-sidebar').classList.toggle('open')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <h1 class="topbar-title">Organization Chart</h1>
      <div class="topbar-right">
        <div class="theme-toggle-slot" data-theme-switcher></div>
        <div class="notif-bell-wrapper" id="notif-bell-wrapper">
          <button class="icon-btn" id="notif-bell-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span class="notif-badge hidden" id="notif-badge">0</span>
          </button>
        </div>
        <div class="topbar-avatar" id="topbar-avatar">--</div>
      </div>
    </header>
    <main class="page-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div class="field" style="margin: 0; width: 300px;">
          <input type="text" id="org-search" placeholder="Search employees..." />
        </div>
        <button class="btn btn-secondary" onclick="window.print()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
          Export
        </button>
      </div>
      
      <div class="org-chart-wrap" id="org-chart-wrap">
        <!-- Rendered by JS -->
      </div>
    </main>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/sidebar.js"></script>
<script src="../js/components/notification-center.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/org-chart.js"></script>
</body>
</html>
