<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile & Settings · TrueShift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function(){
      try {
        var s = localStorage.getItem('trueshift_theme_pref') || 'light';
        var r = s === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : s;
        document.documentElement.setAttribute('data-theme', r);
      } catch(e){}
    })();
  </script>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    .profile-layout {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 32px;
    }
    .profile-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }
    .profile-avatar-large {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--color-accent-blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 2.5rem;
      margin: 0 auto 20px;
      position: relative;
    }
    .profile-name {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .profile-meta {
      color: var(--color-ink-soft);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .tabs-nav {
      display: flex;
      gap: 24px;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 24px;
    }
    .tab-btn {
      padding: 12px 0;
      background: none;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-ink-soft);
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .tab-btn.active {
      color: var(--color-navy);
      border-bottom-color: var(--color-accent-blue);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .settings-section {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 24px;
    }
    .settings-section h3 {
      margin-bottom: 16px;
      font-size: 1.1rem;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 12px;
    }
    .session-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--color-border);
    }
    .session-item:last-child {
      border-bottom: none;
    }
    @media (max-width: 900px) {
      .profile-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <aside id="app-sidebar" class="sidebar"></aside>
  <div class="main-area">
    <header class="topbar">
      <button class="hamburger-btn" onclick="document.getElementById('app-sidebar').classList.toggle('open')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <h1 class="topbar-title">Profile & Settings</h1>
      <div class="topbar-right">
        <div class="theme-toggle-slot" data-theme-switcher></div>
        <div class="notif-bell-wrapper" id="notif-bell-wrapper">
          <button class="icon-btn" id="notif-bell-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span class="notif-badge hidden" id="notif-badge">0</span>
          </button>
        </div>
        <div class="topbar-avatar" id="topbar-avatar">--</div>
      </div>
    </header>
    <main class="page-content">
      <div class="profile-layout">
        <!-- Left Column -->
        <div>
          <div class="profile-card">
            <div class="profile-avatar-large" id="profile-avatar">--</div>
            <div class="profile-name" id="profile-name">Loading...</div>
            <div class="profile-meta">
              <span id="profile-role" class="chip chip-neutral" style="margin-bottom:8px; display:inline-block;">Role</span><br/>
              Emp ID: <span id="profile-empid">...</span><br/>
              Dept: <span id="profile-dept">...</span>
            </div>
            <button class="btn btn-secondary btn-block" onclick="document.getElementById('photo-upload').click()">Edit Photo</button>
            <input type="file" id="photo-upload" style="display:none" accept="image/*" />
          </div>
        </div>
        
        <!-- Right Column -->
        <div>
          <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('account')">Account</button>
            <button class="tab-btn" onclick="switchTab('security')">Security</button>
            <button class="tab-btn" onclick="switchTab('sessions')">Sessions</button>
          </div>
          
          <!-- Account Tab -->
          <div id="tab-account" class="tab-content active">
            <div class="settings-section">
              <h3>Personal Information</h3>
              <form id="profile-form">
                <div class="field">
                  <label>Full Name</label>
                  <input type="text" id="input-name" required />
                </div>
                <div class="field">
                  <label>Designation</label>
                  <input type="text" id="input-designation" />
                </div>
                <div class="field">
                  <label>Email Address</label>
                  <input type="email" id="input-email" disabled style="background:#f5f5f5;" />
                </div>
                <button type="submit" class="btn btn-primary" id="btn-save-profile">Save Changes</button>
              </form>
            </div>
          </div>
          
          <!-- Security Tab -->
          <div id="tab-security" class="tab-content">
            <div class="settings-section">
              <h3>Change Password</h3>
              <form id="password-form">
                <div class="field">
                  <label>Current Password</label>
                  <input type="password" id="current-password" required />
                </div>
                <div class="field">
                  <label>New Password</label>
                  <input type="password" id="new-password" required minlength="8" />
                </div>
                <div class="field">
                  <label>Confirm New Password</label>
                  <input type="password" id="confirm-password" required minlength="8" />
                </div>
                <button type="submit" class="btn btn-primary" id="btn-save-password">Update Password</button>
              </form>
            </div>
            
            <div class="settings-section">
              <h3>Two-Factor Authentication (2FA)</h3>
              <div id="tfa-status-area">
                <!-- Rendered by JS -->
              </div>
            </div>
          </div>
          
          <!-- Sessions Tab -->
          <div id="tab-sessions" class="tab-content">
            <div class="settings-section">
              <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--color-border); padding-bottom:12px; margin-bottom:16px;">
                <h3 style="border:none; margin:0; padding:0;">Active Sessions</h3>
                <button class="btn btn-secondary" onclick="window.revokeAllSessions()">Revoke All Other</button>
              </div>
              <div id="sessions-list">
                <p>Loading sessions...</p>
              </div>
            </div>
          </div>
          
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/sidebar.js"></script>
<script src="../js/components/notification-center.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/profile.js"></script>
</body>
</html>
