<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work Locations · TrueShift</title>
  <meta name="description" content="Manage office and work-site geofence locations for on-site attendance validation." />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function(){
      try {
        var s = localStorage.getItem('trueshift_theme_pref') || 'light';
        var r = s === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : s;
        document.documentElement.setAttribute('data-theme', r);
      } catch(e){}
    })();
  </script>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    .location-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }
    .location-card {
      background: var(--color-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 20px;
      position: relative;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .location-card:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    .location-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .location-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-ink);
      line-height: 1.3;
    }
    .location-address {
      font-size: 0.82rem;
      color: var(--color-ink-muted);
      margin-top: 2px;
    }
    .location-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border-light);
    }
    .location-meta-item {
      font-size: 0.78rem;
    }
    .location-meta-label {
      color: var(--color-ink-muted);
      display: block;
      margin-bottom: 2px;
    }
    .location-meta-value {
      font-weight: 600;
      color: var(--color-ink);
    }
    .location-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .map-preview {
      width: 100%;
      height: 130px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }
    .map-pin-pulse {
      width: 16px;
      height: 16px;
      background: var(--color-primary);
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(29, 78, 216, 0.4);
      animation: pulse-ring 1.5s infinite;
    }
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(29,78,216,0.4); }
      70%  { box-shadow: 0 0 0 14px rgba(29,78,216,0); }
      100% { box-shadow: 0 0 0 0 rgba(29,78,216,0); }
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-box {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
      position: relative;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--color-ink);
      margin-bottom: 20px;
    }
    .form-field { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--color-ink-soft);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      background: var(--color-bg);
      color: var(--color-ink);
      box-sizing: border-box;
      transition: border-color 0.15s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--color-primary);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-hint { font-size: 0.76rem; color: var(--color-ink-muted); margin-top: 4px; }
    .form-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
    .gps-capture-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      padding: 6px 10px;
      background: var(--color-surface-alt, #f8f7f4);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--color-primary);
      font-weight: 600;
      margin-top: 6px;
    }
    .gps-capture-btn:hover { background: var(--border-light); }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--color-ink-muted);
    }
    .empty-state-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state-title { font-size: 1.1rem; font-weight: 600; color: var(--color-ink); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="main-area">
      <header class="topbar">
        <button class="hamburger-btn" id="hamburger-btn" onclick="document.getElementById('app-sidebar').classList.toggle('open')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <h1 class="topbar-title">Work Locations</h1>
        <div class="topbar-right">
          <div class="theme-toggle-slot" data-theme-switcher></div>
          <div class="notif-bell-wrapper" id="notif-bell-wrapper">
            <button class="icon-btn" id="notif-bell-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              <span class="notif-badge hidden" id="notif-badge">0</span>
            </button>
          </div>
          <div class="topbar-avatar" id="topbar-avatar">--</div>
        </div>
      </header>

      <main class="page-content" style="max-width:1100px;margin:0 auto;">

        <!-- Page header with action -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <div>
            <p style="color:var(--color-ink-muted);font-size:0.88rem;margin:0;">
              Define office/site geofences. On-site employees must be within the radius to mark attendance.
            </p>
          </div>
          <button id="add-location-btn" class="btn btn-primary" style="white-space:nowrap;">
            + Add Location
          </button>
        </div>

        <!-- Stats row -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:8px;">
          <div class="card" style="padding:16px 20px;">
            <div style="font-size:0.78rem;color:var(--color-ink-muted);margin-bottom:4px;">Total Locations</div>
            <div style="font-size:1.6rem;font-weight:700;color:var(--color-ink);" id="stat-total">—</div>
          </div>
          <div class="card" style="padding:16px 20px;">
            <div style="font-size:0.78rem;color:var(--color-ink-muted);margin-bottom:4px;">Active</div>
            <div style="font-size:1.6rem;font-weight:700;color:var(--color-success,#16a34a);" id="stat-active">—</div>
          </div>
          <div class="card" style="padding:16px 20px;">
            <div style="font-size:0.78rem;color:var(--color-ink-muted);margin-bottom:4px;">Avg. Radius</div>
            <div style="font-size:1.6rem;font-weight:700;color:var(--color-primary);" id="stat-radius">—</div>
          </div>
        </div>

        <!-- Cards grid -->
        <div class="location-grid" id="location-grid">
          <!-- populated by JS -->
        </div>

      </main>
    </div>
  </div>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay" id="location-modal">
    <div class="modal-box">
      <div class="modal-title" id="modal-title">Add Work Location</div>

      <div class="form-field">
        <label class="form-label" for="loc-name">Location Name *</label>
        <input class="form-input" id="loc-name" placeholder="e.g. HQ Floor 4, Downtown Branch" />
      </div>

      <div class="form-field">
        <label class="form-label" for="loc-address">Address</label>
        <input class="form-input" id="loc-address" placeholder="Street address (optional)" />
      </div>

      <div class="form-row">
        <div class="form-field">
          <label class="form-label" for="loc-lat">Latitude *</label>
          <input class="form-input" id="loc-lat" type="number" step="any" placeholder="e.g. 28.6139" />
        </div>
        <div class="form-field">
          <label class="form-label" for="loc-lng">Longitude *</label>
          <input class="form-input" id="loc-lng" type="number" step="any" placeholder="e.g. 77.2090" />
        </div>
      </div>
      <button class="gps-capture-btn" id="capture-gps-btn">
        📍 Use My Current GPS
      </button>
      <div class="form-hint" id="gps-capture-status" style="margin-top:6px;"></div>

      <div class="form-field" style="margin-top:16px;">
        <label class="form-label" for="loc-radius">Geofence Radius (metres) *</label>
        <input class="form-input" id="loc-radius" type="number" min="10" max="5000" value="150" />
        <div class="form-hint">Employees must be within this distance of the GPS point to check in.</div>
      </div>

      <div class="form-field" id="active-toggle-wrap" style="display:none;">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
          <input type="checkbox" id="loc-active" checked style="width:16px;height:16px;" />
          <span class="form-label" style="margin:0;">Active (visible to check-in system)</span>
        </label>
      </div>

      <div class="form-actions">
        <button class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="modal-save-btn">Save Location</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/notification-center.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/locations.js"></script>
</body>
</html>
