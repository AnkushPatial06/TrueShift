<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance · TrueShift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function(){
      try {
        var s = localStorage.getItem('trueshift_theme_pref') || 'light';
        var r = s === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : s;
        document.documentElement.setAttribute('data-theme', r);
      } catch(e){}
    })();
  </script>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    .two-column-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 768px) {
      .two-column-layout {
        grid-template-columns: 1fr;
      }
    }
    .camera-container {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #000;
      aspect-ratio: 4/3;
      margin-bottom: 16px;
    }
    .guide-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      height: 80%;
      border: 4px dashed rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      pointer-events: none;
    }
    .mini-list-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .mini-list-item:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="main-area">
      <header class="topbar">
        <button class="hamburger-btn" id="hamburger-btn" onclick="document.getElementById('app-sidebar').classList.toggle('open')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <h1 class="topbar-title">Attendance</h1>
        <div class="topbar-right">
          <div class="theme-toggle-slot" data-theme-switcher></div>
          <div class="notif-bell-wrapper" id="notif-bell-wrapper">
            <button class="icon-btn" id="notif-bell-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              <span class="notif-badge hidden" id="notif-badge">0</span>
            </button>
          </div>
          <div class="topbar-avatar" id="topbar-avatar">--</div>
        </div>
      </header>
      <main class="page-content" style="max-width:960px;margin:0 auto;">
        
        <div class="two-column-layout">
          <!-- Left Column -->
          <div class="card">
            <div class="section-title">Face Check-In</div>
            <div class="field">
              <label>Employee ID</label>
              <input id="employee-id-field" placeholder="e.g. EMP-1024" />
            </div>

            <!-- Work Location & Policy Banner -->
            <div id="work-location-banner" style="
              background: var(--color-surface-alt, #f8f7f4);
              border: 1px solid var(--border-light);
              border-radius: var(--radius-sm, 6px);
              padding: 10px 14px;
              margin-bottom: 12px;
              display: flex;
              flex-direction: column;
              gap: 4px;
            ">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--color-ink-soft); font-weight:700;">Assigned Work Location</span>
                <span id="loc-type-badge" class="chip chip-neutral" style="font-size:0.75rem; padding:2px 8px;">Detecting...</span>
              </div>
              <div id="loc-name-display" style="font-size:0.95rem; font-weight:600; color:var(--color-ink);">Fetching profile…</div>
              <div id="loc-policy-hint" style="font-size:0.75rem; color:var(--color-ink-muted);">Checking verification policies...</div>
            </div>

            <!-- GPS Status Bar -->
            <div id="gps-status-badge" style="
              background: var(--color-surface-alt, #f8f7f4);
              border: 1px solid var(--border-light);
              border-radius: var(--radius-sm, 6px);
              padding: 8px 12px;
              font-size: 0.82rem;
              margin-bottom: 12px;
              min-height: 34px;
              display: flex;
              align-items: center;
            ">
              <span style="color:var(--color-ink-muted);font-weight:600;">⏳ Initialising location…</span>
            </div>

            <div class="camera-container">
              <video id="camera-feed" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;"></video>
              <div class="guide-ring"></div>
            </div>
            <button id="retry-camera-btn" type="button" class="btn btn-secondary btn-sm hidden" style="margin:-6px 0 12px; align-self:flex-start;">Retry camera access</button>
            <canvas id="capture-canvas" class="hidden"></canvas>

            <div style="display:flex;gap:10px;">
              <button id="check-in-btn" class="btn btn-primary btn-block hidden" disabled>Check In</button>
              <button id="check-out-btn" class="btn btn-primary btn-block hidden" disabled>Check Out</button>
            </div>
            <p id="attendance-action-note" class="field-hint" role="status" aria-live="polite" style="margin:10px 0 0;"></p>
            <p class="field-hint" style="margin-top:10px;">
              A short liveness check runs automatically — hold still, then blink or turn your head slightly
              when the camera is capturing.
            </p>
          </div>

          <!-- Right Column -->
          <div style="display: flex; flex-direction: column; gap: 24px;">
            <div class="card">
              <div class="section-title">Today's Status</div>
              <div id="today-status-container">
                <!-- Skeleton loader -->
              </div>
            </div>

            <div class="card">
              <div class="section-title">Last 7 Days</div>
              <div id="history-container">
                <!-- Skeleton loader -->
              </div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/skeleton.js"></script>
  <script src="../js/components/table.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/notification-center.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/face-attendance.js"></script>
</body>
</html>
