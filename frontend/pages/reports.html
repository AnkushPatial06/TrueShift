<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reports · TrueShift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  (function(){
    try {
      var s = localStorage.getItem('trueshift_theme_pref') || 'light';
      var r = s === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : s;
      document.documentElement.setAttribute('data-theme', r);
    } catch(e){}
  })();
</script>
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/forms.css" />
<link rel="stylesheet" href="../css/components.css" />
</head>
<body>
<div class="app-shell">
  <aside id="app-sidebar" class="sidebar"></aside>
  <div class="main-area">
    <header class="topbar">
      <button class="hamburger-btn" id="hamburger-btn" onclick="document.getElementById('app-sidebar').classList.toggle('open')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <h1 class="topbar-title">Reports</h1>
      <div class="topbar-right">
        <div class="theme-toggle-slot" data-theme-switcher></div>
        <div class="notif-bell-wrapper" id="notif-bell-wrapper">
          <button class="icon-btn" id="notif-bell-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span class="notif-badge hidden" id="notif-badge">0</span>
          </button>
        </div>
        <div class="topbar-avatar" id="topbar-avatar">--</div>
      </div>
    </header>
    <main class="page-content" style="max-width:800px;margin:0 auto;">

      <div id="org-reports-section" class="card hidden" style="margin-bottom: 24px;">
        <div class="section-title">Export Organization Report</div>
        <p class="field-hint" style="margin-bottom: 16px;">Generate comprehensive data exports for all employees.</p>
        
        <form id="report-form">
          <div class="field">
            <label>Report type</label>
            <div style="display:flex; gap:16px;">
              <label style="flex:1; border:1px solid var(--border-light); padding:16px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:8px;">
                <input type="radio" name="report-type" value="attendance" checked />
                <span><strong>Attendance</strong><br><span style="font-size:12px; color:var(--color-ink-soft); font-weight:normal;">Check-ins, hours, and status</span></span>
              </label>
              <label style="flex:1; border:1px solid var(--border-light); padding:16px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:8px;">
                <input type="radio" name="report-type" value="leave" />
                <span><strong>Leave</strong><br><span style="font-size:12px; color:var(--color-ink-soft); font-weight:normal;">Approved leaves and balances</span></span>
              </label>
            </div>
          </div>
          <div style="display:flex; gap:16px;">
            <div class="field" style="flex:1;">
              <label>Start Date</label>
              <input type="date" id="report-start" required />
            </div>
            <div class="field" style="flex:1;">
              <label>End Date</label>
              <input type="date" id="report-end" required />
            </div>
          </div>
          <div class="field">
            <label>Format</label>
            <select id="file-format">
              <option value="csv">CSV</option>
              <option value="excel">Excel (.xlsx)</option>
              <option value="pdf">PDF</option>
            </select>
          </div>
          <button type="submit" id="download-btn" class="btn btn-primary">Download Org Report</button>
        </form>
      </div>

      <div class="card" id="personal-reports-section">
        <div class="section-title">Export My Records</div>
        <p class="field-hint" style="margin-bottom: 16px;">Download your personal attendance and leave history.</p>
        
        <div style="display: flex; gap: 16px; flex-wrap: wrap;">
          <button id="dl-my-attendance-btn" class="btn btn-secondary" style="flex:1; padding: 24px; justify-content:center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="margin-bottom:8px;"><path d="M12 15V3M12 15L8 11M12 15L16 11M2 17L2.62 19.47C2.79 20.17 3.42 20.67 4.14 20.67H19.85C20.57 20.67 21.2 20.17 21.37 19.47L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <br>Download My Attendance PDF
          </button>
          
          <button id="dl-my-leave-btn" class="btn btn-secondary" style="flex:1; padding: 24px; justify-content:center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="margin-bottom:8px;"><path d="M12 15V3M12 15L8 11M12 15L16 11M2 17L2.62 19.47C2.79 20.17 3.42 20.67 4.14 20.67H19.85C20.57 20.67 21.2 20.17 21.37 19.47L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <br>Download My Leave History PDF
          </button>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/skeleton.js"></script>
<script src="../js/components/table.js"></script>
<script src="../js/components/sidebar.js"></script>
<script src="../js/components/notification-center.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/reports.js"></script>
</body>
</html>
