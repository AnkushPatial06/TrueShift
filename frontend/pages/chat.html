<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat · TrueShift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function(){
      try {
        var s = localStorage.getItem('trueshift_theme_pref') || 'light';
        var r = s === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : s;
        document.documentElement.setAttribute('data-theme', r);
      } catch(e){}
    })();
  </script>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    .page-content { padding: 20px clamp(16px, 4vw, 40px) 24px; height: calc(100vh - 64px); display: flex; flex-direction: column; max-width:1440px; margin:0 auto; }
    .chat-intro { display:flex; justify-content:space-between; align-items:center; gap:16px; margin:0 0 16px; }
    .chat-intro h2 { margin:0 0 4px; font-size:1.1rem; color:var(--color-ink); }
    .chat-intro p { margin:0; color:var(--color-ink-soft); font-size:.84rem; }
    .chat-container { display: flex; flex: 1; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow-card); min-height: 0; margin-bottom: 0; }
    .conv-panel { width: 280px; border-right: 1px solid var(--color-border); display: flex; flex-direction: column; flex-shrink: 0; }
    .conv-panel-header { padding: 16px; border-bottom: 1px solid var(--color-border); font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; justify-content: space-between; }
    .conv-list { flex: 1; overflow-y: auto; }
    .conv-search-wrap { position:relative; display:block; padding:12px 14px; border-bottom:1px solid var(--color-border); }
    .conv-search { width:100%; min-height:40px; box-sizing:border-box; padding:9px 12px 9px 36px; border:1px solid var(--color-border); border-radius:11px; background:var(--color-bg); color:var(--color-ink); font:inherit; font-size:.84rem; outline:none; }
    .conv-search:focus { border-color:var(--color-primary); box-shadow:0 0 0 3px color-mix(in srgb, var(--color-primary) 14%, transparent); }
    .conv-search-wrap svg { position:absolute; left:25px; top:23px; color:var(--color-ink-soft); pointer-events:none; }
    .conv-item { width:100%; box-sizing:border-box; display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; border:0; border-bottom: 1px solid var(--color-border); background:transparent; color:var(--color-ink); text-align:left; font:inherit; transition: background 0.1s; }
    .conv-item:hover { background: var(--color-bg); }
    .conv-item.active { background: var(--color-accent-blue-soft); }
    .conv-empty, .conv-error { padding:24px 16px; text-align:center; color:var(--color-ink-soft); font-size:.84rem; line-height:1.5; }
    .conv-error { color:var(--color-danger); }
    .message-empty { margin:auto; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; color:var(--color-ink-soft); padding:24px; }
    .message-empty strong { color:var(--color-ink); }
    .conv-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--color-accent-blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700; flex-shrink: 0; }
    .conv-info { flex: 1; min-width: 0; }
    .conv-name { font-weight: 600; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-preview { font-size: 0.78rem; color: var(--color-ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .conv-unread { background: var(--color-danger); color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; flex-shrink: 0; font-weight: 700; min-width: 18px; text-align: center; }
    .chat-window { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-header-bar { padding: 14px 20px; border-bottom: 1px solid var(--color-border); display: flex; align-items: center; gap: 12px; background: var(--color-surface); }
    .chat-back-btn { display:none; }
    .chat-header-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--color-navy); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700; flex-shrink: 0; }
    .chat-header-info { flex: 1; }
    .chat-header-name { font-weight: 700; font-size: 0.95rem; }
    .chat-header-sub { font-size: 0.78rem; color: var(--color-ink-soft); }
    .chat-messages-area { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; background: var(--color-bg); }
    .msg-row { display: flex; flex-direction: column; }
    .msg-row.mine { align-items: flex-end; }
    .msg-row.theirs { align-items: flex-start; }
    .msg-sender { font-size: 0.72rem; color: var(--color-ink-soft); margin-bottom: 4px; padding: 0 4px; }
    .msg-bubble { max-width: 68%; padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; line-height: 1.5; word-break: break-word; }
    .msg-bubble.mine { background: var(--color-primary); color: #fff; border-bottom-right-radius: 4px; }
    .msg-bubble.theirs { background: var(--color-surface); color: var(--color-ink); border: 1px solid var(--color-border); border-bottom-left-radius: 4px; }
    .msg-bubble.system { background: var(--color-accent-blue-soft); color: var(--color-accent-blue); border-radius: 10px; font-size: 0.83rem; max-width: 80%; text-align: center; align-self: center; }
    .msg-time { font-size: 0.7rem; color: var(--color-ink-soft); margin-top: 4px; padding: 0 4px; }
    .chat-input-bar { padding: 14px 20px; border-top: 1px solid var(--color-border); display: flex; align-items: flex-end; gap: 10px; background: var(--color-surface); }
    .chat-textarea { flex: 1; border: 1px solid var(--color-border); border-radius: 20px; padding: 10px 16px; font-family: var(--font-body); font-size: 0.9rem; resize: none; max-height: 100px; line-height: 1.4; outline: none; transition: border-color 0.15s; }
    .chat-textarea:focus { border-color: var(--color-accent-blue); }
    .chat-send-btn { border-radius: 50%; width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .chat-no-conv { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 40px; text-align: center; }
    .chat-no-conv-icon { width: 80px; height: 80px; border-radius: 26px; background:linear-gradient(145deg,var(--color-accent-blue-soft),var(--color-surface)); border:1px solid var(--color-border); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow:0 10px 25px rgba(37,99,235,.08); }
    .chat-topics { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:18px; }
    .chat-topic { border:1px solid var(--color-border); background:var(--color-surface); color:var(--color-ink-soft); padding:7px 11px; border-radius:999px; font-size:.75rem; }
    .date-sep { text-align: center; font-size: 0.75rem; color: var(--color-ink-soft); margin: 8px 0; position: relative; }
    .date-sep::before, .date-sep::after { content: ''; position: absolute; top: 50%; width: 30%; height: 1px; background: var(--color-border); }
    .date-sep::before { left: 0; } .date-sep::after { right: 0; }
    @media (max-width: 768px) { .conv-panel { width: 220px; } }
    @media (max-width:640px) {
      .page-content { height:calc(100dvh - 64px); padding:12px; }
      .chat-intro { margin-bottom:10px; }
      .chat-container { border-radius:14px; }
      .conv-panel { width:100%; border-right:0; }
      .chat-window { display:none; }
      .chat-container.mobile-chat-open .conv-panel { display:none; }
      .chat-container.mobile-chat-open .chat-window { display:flex; width:100%; }
      .chat-back-btn { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border:1px solid var(--color-border); border-radius:10px; background:var(--color-bg); color:var(--color-ink); flex-shrink:0; }
      .chat-header-bar { padding:10px 12px; }
      .chat-messages-area { padding:16px 12px; }
      .chat-input-bar { padding:10px 12px; }
      .msg-bubble { max-width:86%; }
      .chat-no-conv { padding:24px; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <aside id="app-sidebar" class="sidebar"></aside>
  <div class="main-area">
    <header class="topbar">
      <button class="hamburger-btn" onclick="document.getElementById('app-sidebar').classList.toggle('open')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <h1 class="topbar-title">Chat</h1>
      <div class="topbar-right">
        <div class="theme-toggle-slot" data-theme-switcher></div>
        <div class="notif-bell-wrapper" id="notif-bell-wrapper">
          <button class="icon-btn" id="notif-bell-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="notif-badge hidden" id="notif-badge">0</span></button>
        </div>
        <div class="topbar-avatar" id="topbar-avatar">--</div>
      </div>
    </header>
    <main class="page-content">
      <div class="chat-intro">
        <div><h2>Team conversations</h2><p>A clear, private space to stay connected with your team.</p></div>
      </div>
      <div class="chat-container">
        <!-- LEFT: Conversation List -->
        <div class="conv-panel">
          <div class="conv-panel-header">
            <span>Conversations</span>
            <div id="conv-new-btn" class="hidden">
              <button class="btn btn-primary btn-sm" id="start-hr-btn">+ HR Chat</button>
            </div>
          </div>
          <label class="conv-search-wrap" aria-label="Search conversations">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="conv-search" class="conv-search" type="search" placeholder="Search conversations" autocomplete="off" />
          </label>
          <div class="conv-list" id="conv-list">
            <div style="padding:24px; text-align:center; color:var(--color-ink-soft); font-size:0.88rem;">Loading...</div>
          </div>
        </div>
        <!-- RIGHT: Chat Window -->
        <div class="chat-window">
          <!-- Empty state -->
          <div class="chat-no-conv" id="chat-empty">
            <div class="chat-no-conv-icon">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-blue)" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            </div>
            <div style="font-weight:700; font-size:1.05rem; margin-bottom:8px;" id="chat-empty-title">Select a conversation</div>
            <div style="color:var(--color-ink-soft); font-size:0.88rem; max-width:320px; line-height:1.6;" id="chat-empty-sub">Choose a conversation from the list to start messaging.</div>
            <div class="chat-topics" aria-label="Common topics"><span class="chat-topic">Leave &amp; time off</span><span class="chat-topic">Pay &amp; benefits</span><span class="chat-topic">Workplace support</span></div>
            <button class="btn btn-primary" style="margin-top:20px;" id="start-conv-btn" onclick="startHRConversation()">Start HR Conversation</button>
          </div>
          <!-- Active chat -->
          <div id="chat-active" style="display:none; flex-direction:column; flex:1; min-height:0;">
            <div class="chat-header-bar">
              <button class="chat-back-btn" id="chat-back-btn" type="button" aria-label="Back to conversations">←</button>
              <div class="chat-header-avatar" id="chat-hdr-avatar">HR</div>
              <div class="chat-header-info">
                <div class="chat-header-name" id="chat-hdr-name">HR Support</div>
                <div class="chat-header-sub" id="chat-hdr-sub">HR Team</div>
              </div>
            </div>
            <div class="chat-messages-area" id="chat-messages"></div>
            <div class="chat-input-bar">
              <textarea class="chat-textarea" id="chat-input" placeholder="Type a message..." rows="1"></textarea>
              <button class="btn btn-primary chat-send-btn" id="send-btn" title="Send">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/sidebar.js"></script>
<script src="../js/components/notification-center.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/chat.js"></script>
</body>
</html>
